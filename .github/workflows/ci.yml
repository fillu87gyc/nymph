name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  unit:
    name: Unit & Component tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: bunx playwright install chromium --with-deps
      - name: Generate missing VRT baselines
        if: github.event_name == 'pull_request'
        run: |
          NEED_PUSH=0
          # ベースラインが 1 つでも欠けている VRT テストだけを CI 環境で生成する。
          # （既存ベースラインは上書きしないので、実際の見た目リグレッションは
          #   差分として検出され、ここで握りつぶされることはない）
          gen() {
            local testfile="$1"; shift
            local missing=0
            for snap in "$@"; do [ -f "$snap" ] || missing=1; done
            if [ "$missing" = "1" ]; then
              bunx playwright test --config playwright.vrt.config.ts "$testfile" --update-snapshots
              git add "${testfile}-snapshots"
              NEED_PUSH=1
            fi
          }
          gen tests/e2e/fullspec_vrt.test.ts \
            tests/e2e/fullspec_vrt.test.ts-snapshots/fullspec-vrt-linux.png
          gen tests/e2e/diff_vrt.test.ts \
            tests/e2e/diff_vrt.test.ts-snapshots/diff-aside-single-linux.png \
            tests/e2e/diff_vrt.test.ts-snapshots/diff-aside-multiline-linux.png
          if [ "$NEED_PUSH" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git diff --staged --quiet || git commit -m "test: generate VRT baselines in CI environment [skip ci]"
            git push origin HEAD
          fi
      - run: bun run test:e2e
      - run: bun run test:e2e:vrt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
