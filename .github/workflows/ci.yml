name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify dist contents
        run: |
          set -e
          echo "=== dist/ structure ==="
          find dist -type f | sort

          [ -f dist/index.html ] || { echo "ERROR: dist/index.html not found"; exit 1; }
          [ -s dist/index.html ] || { echo "ERROR: dist/index.html is empty"; exit 1; }

          js_count=$(find dist/assets -name "*.js" -size +0c 2>/dev/null | wc -l)
          [ "$js_count" -gt 0 ] || { echo "ERROR: no non-empty JS files in dist/assets/"; exit 1; }

          css_count=$(find dist/assets -name "*.css" -size +0c 2>/dev/null | wc -l)
          [ "$css_count" -gt 0 ] || { echo "ERROR: no non-empty CSS files in dist/assets/"; exit 1; }

          echo "OK: dist/index.html, ${js_count} JS file(s), ${css_count} CSS file(s)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  unit:
    name: Unit & Component tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: bunx playwright install chromium --with-deps
      - name: Generate missing VRT baselines
        if: github.event_name == 'pull_request'
        run: |
          NEED_PUSH=0
          # ベースラインが 1 つでも欠けている VRT テストだけを CI 環境で生成する。
          # （既存ベースラインは上書きしないので、実際の見た目リグレッションは
          #   差分として検出され、ここで握りつぶされることはない）
          gen() {
            local testfile="$1"; shift
            local missing=0
            for snap in "$@"; do [ -f "$snap" ] || missing=1; done
            if [ "$missing" = "1" ]; then
              bunx playwright test --config playwright.vrt.config.ts "$testfile" --update-snapshots
              git add "${testfile}-snapshots"
              NEED_PUSH=1
            fi
          }
          gen tests/e2e/fullspec_vrt.test.ts \
            tests/e2e/fullspec_vrt.test.ts-snapshots/fullspec-vrt-linux.png
          gen tests/e2e/diff_vrt.test.ts \
            tests/e2e/diff_vrt.test.ts-snapshots/diff-aside-single-linux.png \
            tests/e2e/diff_vrt.test.ts-snapshots/diff-aside-multiline-linux.png
          if [ "$NEED_PUSH" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git diff --staged --quiet || git commit -m "test: generate VRT baselines in CI environment [skip ci]"
            git push origin HEAD
          fi
      - run: bun run test:e2e
      - run: bun run test:e2e:vrt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-screenshots
          path: playwright-screenshots/
          retention-days: 14
      - name: スクリーンショットを PR description に埋め込む
        if: github.event_name == 'pull_request' && always()
        run: |
          shopt -s nullglob
          pngs=(playwright-screenshots/*.png)
          [ ${#pngs[@]} -eq 0 ] && echo "No screenshots found, skipping." && exit 0

          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          RUN_ID="${{ github.run_id }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          gh release view screenshots &>/dev/null || \
            gh release create screenshots \
              --title "PR Screenshots (auto-generated)" \
              --notes "PR デモスクリーンショット置き場。手動削除しないこと。" \
              --prerelease

          IMAGE_TAGS=""
          for f in playwright-screenshots/*.png; do
            FNAME="${RUN_ID}-$(basename "$f")"
            cp "$f" "/tmp/$FNAME"
            gh release upload screenshots "/tmp/$FNAME" --clobber
            URL="https://github.com/${OWNER}/${REPO}/releases/download/screenshots/${FNAME}"
            IMAGE_TAGS="${IMAGE_TAGS}![$(basename "$f" .png)](${URL})\n"
          done

          CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
          if echo "$CURRENT_BODY" | grep -q "^## デモ"; then
            NEW_BODY=$(echo "$CURRENT_BODY" | sed '/^## デモ$/,$d')
          else
            NEW_BODY="$CURRENT_BODY"
          fi
          gh pr edit "$PR_NUMBER" --body "$(printf '%s\n\n## デモ\n%b' "$NEW_BODY" "$IMAGE_TAGS")"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
