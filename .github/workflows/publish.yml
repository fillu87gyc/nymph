name: Release

# ⚠️ このファイル名 (.github/workflows/publish.yml) は変更しないこと。
# npmjs の Trusted Publishing は「リポジトリ + ワークフローのファイルパス」で
# OIDC を照合するため、リネームすると照合に失敗して npm publish が
# ENEEDAUTH で落ちる。ファイル名を変えたい場合は npmjs 側の
# Trusted Publisher 設定も同時に更新すること。
#
# リリースは 2 通りの入口がある:
#   1. Actions タブから「Run workflow」でバージョンを指定する（推奨）
#   2. ローカルで `git tag v1.2.3 && git push origin v1.2.3` する
# どちらも同じ job を通り、npm publish と GitHub Release 作成までを行う。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン (例: 1.2.3 / 1.3.0-rc.1)'
        type: string
        required: true
      dry_run:
        description: 'タグ・npm publish・Release 作成を行わず確認だけする'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # タグと GitHub Release の作成
      id-token: write # npm provenance / Trusted Publishing
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - name: バージョンを決める
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::バージョンが semver ではありません: '$VERSION'"
            exit 1
          fi

          # プレリリース (1.3.0-rc.1 など) は npm の latest を汚さないよう next タグに逃がす
          if printf '%s' "$VERSION" | grep -q '-'; then
            NPM_TAG=next
            PRERELEASE=true
          else
            NPM_TAG=latest
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "npm_tag=$NPM_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "リリース対象: v$VERSION (npm dist-tag: $NPM_TAG)"

      - name: タグの状態を確認
        id: tagstate
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TAGGED="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ -z "$TAGGED" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif [ "$TAGGED" = "$(git rev-parse HEAD)" ]; then
            # publish で落ちたあとの再実行。タグは既にあるので作り直さず先へ進む
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::タグ $TAG は同じコミットに既にあるため作成をスキップします"
          else
            echo "::error::タグ $TAG は別のコミット ($TAGGED) に既に存在します。" \
              "そのタグを消して (git push --delete origin $TAG) 実行し直すか、別のバージョンを指定してください"
            exit 1
          fi

      - name: バージョンをソースに反映
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          npm pkg set version="$VERSION"
          sed -i "s/^const VERSION = '.*';/const VERSION = '$VERSION';/" src/cli.ts
          # --version が新しいバージョンを返せることを確認する
          grep -q "^const VERSION = '$VERSION';$" src/cli.ts

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: CLI の --version を確認
        run: |
          set -euo pipefail
          ACTUAL="$(bun run src/cli.ts --version)"
          if [ "$ACTUAL" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::--version が '${{ steps.meta.outputs.version }}' ではなく '$ACTUAL' を返しました"
            exit 1
          fi

      - name: タグを作成して push
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && steps.tagstate.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.meta.outputs.tag }}" -m "Release ${{ steps.meta.outputs.tag }}"
          git push origin "${{ steps.meta.outputs.tag }}"

      - name: npm に publish 済みか確認
        id: published
        run: |
          set -euo pipefail
          NAME="$(npm pkg get name | tr -d '"')"
          if npm view "$NAME@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@${{ steps.meta.outputs.version }} は publish 済みのためスキップします"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish
        if: steps.published.outputs.skip == 'false'
        env:
          # 認証は npmjs の Trusted Publishing (OIDC) に任せる。
          # NODE_AUTH_TOKEN は設定しないこと: 空文字を渡すと setup-node が書いた
          # .npmrc の _authToken が空のまま評価され、OIDC まで到達せず
          # ENEEDAUTH で落ちる。
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--provenance --access public --tag "${{ steps.meta.outputs.npm_tag }}")
          if [ "${DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          npm publish "${ARGS[@]}"

      - name: GitHub Release を作成
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG は既に存在するためスキップします"
            exit 0
          fi
          ARGS=(--title "$TAG" --generate-notes)
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}"
