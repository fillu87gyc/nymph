<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nymph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/base16/gruvbox-dark-medium.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
</head>
<body>
<div id="app">

  <header id="toolbar">
    <span class="brand">nymph</span>
    <div class="watch-badge">
      <span class="watch-dot" id="watch-dot"></span>
      <span id="watch-name">—</span>
    </div>
    <span class="update-time" id="update-time"></span>
    <span class="sep"></span>
    <span class="spacer"></span>
    <button class="btn" id="btn-comments" title="コメントパネル">
      コメント <span id="comment-count"></span>
    </button>
    <button class="btn primary" id="btn-copy">レビューをコピー</button>
    <button class="btn icon" id="btn-clear-all" title="コメントをすべて削除">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M1.5 3.5h11M5.5 3.5V2.5h3v1M3 3.5l.9 8h6.2l.9-8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="sep"></span>
    <button id="btn-checkpoint" class="btn" title="チェックポイントを設定">📍</button>
    <button id="btn-diff" class="btn" title="diff表示切替">± diff</button>
    <button class="btn icon" id="btn-theme" title="テーマ切替">◐</button>
  </header>

  <div id="main">
    <div id="content">
      <div id="welcome">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="6" y="4" width="28" height="32" rx="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 13h16M12 19h16M12 25h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>ファイルを読み込んでいます…</p>
      </div>
    </div>
  </div>

  <div id="comments-panel">
    <div class="panel-resize-handle" id="panel-resize-handle"></div>
    <div class="cpanel-head">
      <span class="cpanel-title">レビューコメント</span>
      <span class="spacer"></span>
      <button class="btn icon" id="btn-close-panel">✕</button>
    </div>
    <ul id="comments-list">
      <li id="no-comments">コメントはまだありません。ブロックにカーソルを合わせて ＋ をクリック。</li>
    </ul>
  </div>

</div>

<!-- Comment input modal -->
<div id="comment-modal">
  <div id="modal-backdrop"></div>
  <div id="modal-box">
    <div class="modal-head" id="modal-line">コメントを追加</div>
    <div class="modal-ctx" id="modal-ctx"></div>
    <textarea id="comment-ta" placeholder="コメントを入力… (Cmd+Enter で追加)" rows="4"></textarea>
    <div class="modal-foot">
      <button class="btn" id="btn-cancel">キャンセル</button>
      <button class="btn primary" id="btn-submit">追加</button>
    </div>
  </div>
</div>

<!-- Clear all confirmation modal -->
<div id="confirm-modal">
  <div id="confirm-backdrop"></div>
  <div id="confirm-box">
    <div class="modal-head">全コメントを削除</div>
    <p class="confirm-msg">本当に消していいですか？</p>
    <div class="modal-foot">
      <button class="btn" id="btn-confirm-cancel">キャンセル</button>
      <button class="btn danger" id="btn-confirm-ok">削除する</button>
    </div>
  </div>
</div>

<!-- draw.io export modal -->
<div id="drawio-modal">
  <div id="drawio-box">
    <div class="dbox-head">
      <span class="dbox-title">draw.io エクスポート</span>
      <button class="btn icon" id="btn-close-drawio">✕</button>
    </div>
    <div class="dbox-hint">
      <strong>.drawio ファイルをダウンロード</strong>して draw.io で開くか、
      コードをコピーして draw.io の <code>挿入 › Mermaid</code> にペースト。
    </div>
    <div class="dbox-code" id="drawio-code"></div>
    <div class="dbox-foot">
      <button class="btn primary" id="btn-dl-drawio">⬇ .drawio ダウンロード</button>
      <button class="btn" id="btn-copy-mermaid">コードをコピー</button>
      <span class="spacer"></span>
    </div>
  </div>
</div>

<!-- Selection comment popup -->
<div id="selection-popup">
  <button id="btn-selection-comment">＋ コメント</button>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  source: '',
  comments: [],
  nextId: 1,
  pending: null,
  editingId: null,
  mermaidPending: null,
  diffMode: false,
  diffData: null,
};

// ── Mermaid init ──────────────────────────────────────────────────────────────
let mermaidSeq = 0;

function initMermaid() {
  const dark = document.documentElement.dataset.theme !== 'light';
  mermaid.initialize({
    startOnLoad: false,
    theme: dark ? 'dark' : 'default',
    securityLevel: 'loose',
    fontFamily: '"JetBrains Mono", monospace',
  });
}
initMermaid();

// ── Rendering ─────────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function assignLines(src, tokens) {
  let from = 0;
  for (const t of tokens) {
    if (!t.raw) continue;
    const idx = src.indexOf(t.raw, from);
    if (idx === -1) continue;
    const before = src.substring(0, idx);
    t.ls = before.split('\n').length;
    const raw = t.raw.endsWith('\n') ? t.raw.slice(0, -1) : t.raw;
    t.le = t.ls + raw.split('\n').length - 1;
    from = idx + t.raw.length;
  }
}

const BLOCK_TYPES = new Set(['paragraph','heading','code','blockquote','list','hr','table','html']);

async function renderSource(src) {
  const el = document.getElementById('content');
  const welcome = document.getElementById('welcome');

  if (!src.trim()) {
    el.innerHTML = '';
    el.appendChild(welcome);
    welcome.classList.remove('hidden');
    return;
  }
  welcome.classList.add('hidden');

  const tokens = marked.lexer(src);
  assignLines(src, tokens);

  const blockTokens = tokens.filter(t => BLOCK_TYPES.has(t.type));
  let idx = 0;

  const renderer = new marked.Renderer();

  function wrap(inner, type, extra = '') {
    const t = blockTokens[idx++] || {};
    const ls = t.ls || 1, le = t.le || ls;
    return `<div class="md-block" data-ls="${ls}" data-le="${le}" data-block-type="${type}"${extra}>` +
           `<button class="comment-btn" aria-label="コメント">＋</button>` +
           inner + '</div>';
  }

  renderer.paragraph = (text) => wrap(`<p>${text}</p>`, 'paragraph');
  renderer.heading    = (text, level) => wrap(`<h${level}>${text}</h${level}>`, 'heading');
  renderer.blockquote = (q)    => wrap(`<blockquote>${q}</blockquote>`, 'blockquote');
  renderer.list       = (body, ordered, start) => {
    const tag = ordered ? `ol${start !== 1 ? ` start="${start}"` : ''}` : 'ul';
    return wrap(`<${tag}>${body}</${tag}>`, 'list');
  };
  renderer.hr         = ()     => wrap('<hr>', 'hr');
  renderer.html       = (html) => wrap(html, 'html');

  renderer.table = (h, b) => {
    const t = blockTokens[idx] || {};
    let extra = '';
    if (t.header) {
      const headers = t.header.map(cell => cell.text || '');
      const rows = (t.rows || []).map(row =>
        Object.fromEntries(row.map((cell, i) => [headers[i] ?? i, cell.text || '']))
      );
      extra = ` data-table-ctx="${esc(JSON.stringify({ headers, rows }))}"`;
    }
    return wrap(`<table><thead>${h}</thead><tbody>${b}</tbody></table>`, 'table', extra);
  };

  renderer.code = (code, lang) => {
    const t = blockTokens[idx++] || {};
    const ls = t.ls || 1, le = t.le || ls;
    if (lang === 'mermaid' || lang === 'mmd') {
      mermaidSeq++;
      const mid = `mermaid-${mermaidSeq}`;
      const enc = encodeURIComponent(code);
      return `<div class="md-block" data-ls="${ls}" data-le="${le}" data-block-type="mermaid">` +
             `<button class="comment-btn">＋</button>` +
             `<div class="mermaid-wrap">` +
             `<div class="mermaid-bar">` +
             `<span class="mermaid-label"><em>Mermaid</em> Diagram</span>` +
             `<button class="btn-drawio" data-code="${enc}">→ draw.io</button>` +
             `</div>` +
             `<div class="mermaid-area"><div class="mermaid" id="${mid}">${esc(code)}</div></div>` +
             `</div></div>`;
    }
    return `<div class="md-block" data-ls="${ls}" data-le="${le}" data-block-type="code">` +
           `<button class="comment-btn">＋</button>` +
           `<pre><code class="language-${esc(lang||'plaintext')}">${esc(code)}</code></pre>` +
           `</div>`;
  };

  const html = marked.parse(src, { renderer });
  mermaidSeq = 0;
  idx = 0;

  el.innerHTML = html;
  el.appendChild(welcome);

  try {
    await mermaid.run({ querySelector: '#content .mermaid' });
  } catch(e) { console.warn('mermaid:', e); }

  if (typeof hljs !== 'undefined') {
    document.querySelectorAll('#content pre code').forEach(el => {
      try { hljs.highlightElement(el); } catch(e) { console.warn('hljs:', e); }
    });
  }

  restoreIndicators();
  attachHandlers();
  if (state.diffMode) applyDiffHighlight();
}

// ── Comment indicators ────────────────────────────────────────────────────────
function restoreIndicators() {
  document.querySelectorAll('.md-block').forEach(b => {
    const ls = +b.dataset.ls, le = +b.dataset.le;
    b.classList.toggle('has-comment', state.comments.some(c => c.ls <= le && c.le >= ls));
  });
}

// ── Block interaction ─────────────────────────────────────────────────────────
function attachHandlers() {
  document.querySelectorAll('.comment-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const b = btn.closest('.md-block');
      const ls = +b.dataset.ls, le = +b.dataset.le;
      const blockType = b.dataset.blockType || 'paragraph';
      let context, displayCtx;

      if (blockType === 'table' && b.dataset.tableCtx) {
        context = JSON.parse(b.dataset.tableCtx);
        displayCtx = context.headers.join(' | ');
      } else if (blockType === 'code' || blockType === 'mermaid') {
        const srcLines = state.source.split('\n');
        const raw = srcLines.slice(ls - 1, le).join('\n');
        const codeLines = raw.split('\n');
        const lang = codeLines[0].replace(/^```+/, '').trim() || null;
        const code = codeLines.slice(1, codeLines[codeLines.length - 1].trimStart().startsWith('```') ? -1 : undefined).join('\n');
        context = lang ? { lang, code } : { code };
        displayCtx = codeLines[1] || '';
      } else {
        const srcLines = state.source.split('\n');
        context = srcLines.slice(ls - 1, Math.min(ls + 2, le)).join('\n');
        displayCtx = context.split('\n')[0];
      }

      openCommentModal(ls, le, displayCtx, blockType, context);
    });
  });

  document.querySelectorAll('.btn-drawio').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openDrawioModal(decodeURIComponent(btn.dataset.code));
    });
  });
}

// ── Text selection popup ──────────────────────────────────────────────────────
function hideSelectionPopup() {
  document.getElementById('selection-popup').classList.remove('visible');
}

function showSelectionPopup() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) { hideSelectionPopup(); return; }

  const range = sel.getRangeAt(0);
  const selectedText = sel.toString().trim();
  if (!selectedText) { hideSelectionPopup(); return; }

  const content = document.getElementById('content');
  if (!content.contains(range.commonAncestorContainer)) { hideSelectionPopup(); return; }

  const rect = range.getBoundingClientRect();
  if (!rect.width && !rect.height) { hideSelectionPopup(); return; }

  const popup = document.getElementById('selection-popup');
  // Temporarily show to measure width
  popup.style.visibility = 'hidden';
  popup.classList.add('visible');
  const pw = popup.offsetWidth;
  popup.style.visibility = '';

  let left = rect.left + (rect.width - pw) / 2;
  let top  = rect.bottom + 8;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  if (top + 40 > window.innerHeight) top = rect.top - 40;

  popup.style.left = left + 'px';
  popup.style.top  = top  + 'px';
}

function openSelectionComment() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return;

  const range    = sel.getRangeAt(0);
  const selected = sel.toString().trim();
  if (!selected) return;

  const toBlock = node =>
    (node.nodeType === 3 ? node.parentElement : node)?.closest?.('.md-block');

  const startBlock = toBlock(range.startContainer);
  const endBlock   = toBlock(range.endContainer);
  const ls = startBlock ? +startBlock.dataset.ls : 1;
  const le = endBlock   ? +endBlock.dataset.le   : ls;
  const ctx = selected.length > 300 ? selected.slice(0, 300) + '…' : selected;

  // 選択開始位置をブロック内の文字オフセットとして記録（同一文字が複数ある場合の disambig 用）
  let selectionOffset = null;
  if (startBlock) {
    const walker = document.createTreeWalker(startBlock, NodeFilter.SHOW_TEXT);
    let node, acc = 0;
    while ((node = walker.nextNode())) {
      if (node === range.startContainer) {
        const leadingWS = sel.toString().length - sel.toString().trimStart().length;
        selectionOffset = acc + range.startOffset + leadingWS;
        break;
      }
      acc += node.textContent.length;
    }
  }

  hideSelectionPopup();
  sel.removeAllRanges();
  openCommentModal(ls, le, ctx, 'selection', ctx, selectionOffset);
}

document.addEventListener('mouseup', () => {
  // Small delay so the selection is finalised before we check
  setTimeout(showSelectionPopup, 30);
});
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) hideSelectionPopup();
});

document.getElementById('btn-selection-comment').addEventListener('mousedown', e => {
  e.preventDefault(); // Keep selection alive through click
});
document.getElementById('btn-selection-comment').addEventListener('click', openSelectionComment);

// ── Comment modal ─────────────────────────────────────────────────────────────
function openCommentModal(ls, le, displayCtx, blockType = 'selection', context = displayCtx, selectionOffset = null) {
  hideSelectionPopup();
  state.pending = { ls, le, blockType, context, selectionOffset };
  state.editingId = null;
  const lineLabel = ls === le ? `L${ls}` : `L${ls}–${le}`;
  const short = displayCtx.length <= 20 ? `「${displayCtx}」` : null;
  document.getElementById('modal-line').textContent =
    short ? `${short} にコメント追加` : `${lineLabel} にコメント追加`;
  document.getElementById('modal-ctx').textContent = displayCtx;
  document.getElementById('comment-ta').value = '';
  document.getElementById('btn-submit').textContent = '追加';
  document.getElementById('comment-modal').classList.add('open');
  document.getElementById('comment-ta').focus();
}
function openEditModal(c) {
  state.pending = { ls: c.ls, le: c.le, blockType: c.block_type, context: c.context, selectionOffset: c.selection_offset ?? null };
  state.editingId = c.id;
  const lineLabel = c.ls === c.le ? `L${c.ls}` : `L${c.ls}–${c.le}`;
  document.getElementById('modal-line').textContent = `${lineLabel} のコメントを編集`;
  document.getElementById('modal-ctx').textContent = ctxDisplay(c);
  document.getElementById('comment-ta').value = c.text;
  document.getElementById('btn-submit').textContent = '更新';
  document.getElementById('comment-modal').classList.add('open');
  document.getElementById('comment-ta').focus();
}
function closeCommentModal() {
  document.getElementById('comment-modal').classList.remove('open');
  document.getElementById('btn-submit').textContent = '追加';
  state.pending = null;
  state.editingId = null;
}
function submitComment() {
  const text = document.getElementById('comment-ta').value.trim();
  if (!text || !state.pending) return;
  if (state.editingId !== null) {
    const c = state.comments.find(x => x.id === state.editingId);
    if (c) c.text = text;
    closeCommentModal();
    saveComments();
    updatePanel();
    toast('コメントを更新しました');
  } else {
    const c = { id: state.nextId++, ls: state.pending.ls, le: state.pending.le,
                block_type: state.pending.blockType, context: state.pending.context,
                ...(state.pending.selectionOffset != null && { selection_offset: state.pending.selectionOffset }),
                text };
    state.comments.push(c);
    state.comments.sort((a,b) => a.ls - b.ls);
    closeCommentModal();
    saveComments();
    updatePanel();
    restoreIndicators();
    openPanel();
    toast('コメントを追加しました');
  }
}

// ── draw.io modal ─────────────────────────────────────────────────────────────
function openDrawioModal(code) {
  state.mermaidPending = code;
  document.getElementById('drawio-code').textContent = code;
  document.getElementById('drawio-modal').classList.add('open');
}
function closeDrawioModal() {
  document.getElementById('drawio-modal').classList.remove('open');
  state.mermaidPending = null;
}
function downloadDrawio(code) {
  const mdata = JSON.stringify({ code, config: {} })
    .replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
<mxfile host="nymph" version="1.0">
  <diagram id="mermaid-${Date.now()}" name="Mermaid Export">
    <mxGraphModel dx="1422" dy="762" grid="1" gridSize="10" page="1"
      pageWidth="1169" pageHeight="827" math="0" shadow="0">
      <root>
        <mxCell id="0"/>
        <mxCell id="1" parent="0"/>
        <UserObject label="" mermaid_data="${mdata}" id="2">
          <mxCell style="shape=mxgraph.mermaid.undefined;html=1;whiteSpace=wrap;align=center;"
            vertex="1" parent="1">
            <mxGeometry x="80" y="80" width="600" height="400" as="geometry"/>
          </mxCell>
        </UserObject>
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
  const blob = new Blob([xml], { type: 'application/xml' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: `mermaid-${Date.now()}.drawio`
  });
  a.click();
  URL.revokeObjectURL(a.href);
  toast('.drawio をダウンロードしました');
}

// ── Comment panel ─────────────────────────────────────────────────────────────
function ctxDisplay(c) {
  const ctx = c.context !== undefined ? c.context : c.ctx;
  if (!ctx) return '';
  if (typeof ctx === 'string') return ctx.split('\n')[0];
  if (ctx.headers) return ctx.headers.join(' | ');
  if (ctx.code) return ctx.code.split('\n')[0];
  return '';
}

const PANEL_DEFAULT_H = 210;
const PANEL_MIN_H = 80;

function openPanel() {
  const panel = document.getElementById('comments-panel');
  const saved = parseInt(localStorage.getItem('nymph-panel-height')) || PANEL_DEFAULT_H;
  panel.style.height = saved + 'px';
  panel.classList.add('open');
}
function closePanel() {
  const panel = document.getElementById('comments-panel');
  panel.style.height = '0';
  panel.classList.remove('open');
}

function updatePanel() {
  const list = document.getElementById('comments-list');
  const noEl = document.getElementById('no-comments');
  const cnt  = document.getElementById('comment-count');
  if (!state.comments.length) {
    list.innerHTML = '';
    list.appendChild(noEl);
    noEl.style.display = '';
    cnt.classList.remove('visible');
    return;
  }
  noEl.style.display = 'none';
  cnt.textContent = state.comments.length;
  cnt.classList.add('visible');
  list.querySelectorAll('.comment-item').forEach(el => el.remove());
  state.comments.forEach(c => {
    const li = document.createElement('li');
    li.className = 'comment-item';
    const range = c.ls === c.le ? `L${c.ls}` : `L${c.ls}–${c.le}`;
    li.innerHTML = `<span class="c-line">${range}</span>
      <div class="c-body">
        <div class="c-text">${esc(c.text)}</div>
        <div class="c-ctx">${esc(ctxDisplay(c))}</div>
      </div>
      <div class="c-actions">
        <button class="c-edit" title="編集">✎</button>
        <button class="c-del" title="削除">✕</button>
      </div>`;
    li.querySelector('.c-edit').addEventListener('click', ev => {
      ev.stopPropagation();
      openEditModal(c);
    });
    li.querySelector('.c-del').addEventListener('click', ev => {
      ev.stopPropagation();
      state.comments = state.comments.filter(x => x.id !== c.id);
      saveComments();
      updatePanel();
      restoreIndicators();
    });
    li.addEventListener('click', () => scrollToLine(c));
    list.appendChild(li);
  });
}

// ── Panel drag resize ─────────────────────────────────────────────────────────
(function() {
  const handle = document.getElementById('panel-resize-handle');
  const panel  = document.getElementById('comments-panel');
  let startY = 0, startH = 0;

  handle.addEventListener('mousedown', e => {
    startY = e.clientY;
    startH = panel.offsetHeight;
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', stopDrag);
    e.preventDefault();
  });

  function onDrag(e) {
    const maxH = Math.floor(window.innerHeight * 0.8);
    const h = Math.max(PANEL_MIN_H, Math.min(maxH, startH + (startY - e.clientY)));
    panel.style.height = h + 'px';
  }

  function stopDrag() {
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', stopDrag);
    localStorage.setItem('nymph-panel-height', panel.offsetHeight);
  }
})();

function scrollToLine(c) {
  const ls = typeof c === 'object' ? c.ls : c;
  const b = document.querySelector(`.md-block[data-ls="${ls}"]`);
  if (!b) return;
  b.scrollIntoView({ behavior: 'smooth', block: 'center' });

  if (typeof c === 'object' && c.block_type === 'selection' && typeof c.context === 'string') {
    highlightSelectionText(c.ls, c.le, c.context, c.selection_offset ?? null);
  } else {
    b.style.outline = '2px solid var(--accent)';
    b.style.outlineOffset = '4px';
    setTimeout(() => { b.style.outline = ''; b.style.outlineOffset = ''; }, 1400);
  }
}

function highlightSelectionText(ls, le, searchText, selectionOffset) {
  if (!searchText) return;
  const needle = searchText.endsWith('…') ? searchText.slice(0, -1) : searchText;

  const blocks = [...document.querySelectorAll('.md-block')].filter(b => {
    const bls = +b.dataset.ls, ble = +b.dataset.le;
    return bls <= le && ble >= ls;
  });

  for (const block of blocks) {
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    let node, accumulated = '';
    const nodes = [];
    while ((node = walker.nextNode())) {
      nodes.push({ node, start: accumulated.length });
      accumulated += node.textContent;
    }

    // selectionOffset があれば正確な出現位置を探し、なければ最初のマッチ
    let idx = selectionOffset != null
      ? accumulated.indexOf(needle, selectionOffset)
      : accumulated.indexOf(needle);
    if (idx === -1 && selectionOffset != null) idx = accumulated.indexOf(needle); // フォールバック
    if (idx === -1) continue;

    let startNode, startOffset, endNode, endOffset;
    for (const { node: n, start } of nodes) {
      const end = start + n.textContent.length;
      if (startNode == null && idx < end) { startNode = n; startOffset = idx - start; }
      if (endNode   == null && idx + needle.length <= end) { endNode = n; endOffset = idx + needle.length - start; break; }
    }
    if (!startNode || !endNode) continue;

    const range = document.createRange();
    range.setStart(startNode, startOffset);
    range.setEnd(endNode, endOffset);

    try {
      const mark = document.createElement('mark');
      mark.className = 'text-highlight';
      range.surroundContents(mark);
      mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => {
        const p = mark.parentNode;
        if (p) { while (mark.firstChild) p.insertBefore(mark.firstChild, mark); p.removeChild(mark); }
      }, 2000);
    } catch {
      // 要素境界をまたぐ選択はアウトラインにフォールバック
      const b = block;
      b.style.outline = '2px solid var(--accent)';
      b.style.outlineOffset = '4px';
      setTimeout(() => { b.style.outline = ''; b.style.outlineOffset = ''; }, 1400);
    }
    return;
  }
}

// ── Copy review ───────────────────────────────────────────────────────────────
function copyReview() {
  if (!state.comments.length) { toast('コメントがありません'); return; }
  const payload = {
    date: new Date().toLocaleDateString('ja-JP'),
    file: document.getElementById('watch-name').textContent,
    comment_count: state.comments.length,
    comments: state.comments.map((c, i) => ({
      id: i + 1,
      line_start: c.ls,
      line_end: c.le,
      block_type: c.block_type || 'unknown',
      context: c.context !== undefined ? c.context : (c.ctx || ''),
      comment: c.text,
    })),
  };
  const out = JSON.stringify(payload, null, 2);
  navigator.clipboard.writeText(out)
    .then(() => toast('レビューをコピーしました'))
    .catch(() => {
      const ta = Object.assign(document.createElement('textarea'), { value: out });
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      toast('レビューをコピーしました');
    });
}

// ── Clear all comments ────────────────────────────────────────────────────────
function openClearAllModal() {
  if (!state.comments.length) { toast('コメントがありません'); return; }
  document.getElementById('confirm-modal').classList.add('open');
}
function closeClearAllModal() {
  document.getElementById('confirm-modal').classList.remove('open');
}
function clearAllComments() {
  state.comments = [];
  state.nextId = 1;
  closeClearAllModal();
  saveComments();
  updatePanel();
  restoreIndicators();
  closePanel();
  toast('コメントをすべて削除しました');
}

// ── Server API ────────────────────────────────────────────────────────────────
async function loadContent() {
  const res = await fetch('/content');
  const { content, filename } = await res.json();
  document.getElementById('watch-name').textContent = filename;
  state.source = content;
  mermaidSeq = 0;
  await renderSource(content);
  const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('update-time').textContent = `更新: ${now}`;
}

async function loadComments() {
  try {
    const res = await fetch('/comments');
    const data = await res.json();
    state.comments = data;
    state.nextId = data.length ? Math.max(...data.map(c => c.id)) + 1 : 1;
    updatePanel();
  } catch(e) {}
}

function saveComments() {
  fetch('/comments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state.comments),
  }).catch(() => {});
}

// ── Checkpoint / Diff ─────────────────────────────────────────────────────
async function loadDiff() {
  const res = await fetch('/diff');
  state.diffData = await res.json();
}

function applyDiffHighlight() {
  if (!state.diffMode || !state.diffData) {
    document.querySelectorAll('.md-block').forEach(el => {
      el.classList.remove('diff-insert', 'diff-delete');
    });
    return;
  }
  const insertLines = new Set(
    state.diffData.lines.filter(l => l.type === 'insert').map(l => l.n)
  );
  document.querySelectorAll('.md-block').forEach(el => {
    const ls = parseInt(el.dataset.ls, 10);
    const le = parseInt(el.dataset.le, 10);
    let hasInsert = false;
    for (let i = ls; i <= le; i++) {
      if (insertLines.has(i)) { hasInsert = true; break; }
    }
    el.classList.toggle('diff-insert', hasInsert);
    el.classList.remove('diff-delete');
  });
}

// ── SSE hot reload ────────────────────────────────────────────────────────────
function connectSSE() {
  const dot = document.getElementById('watch-dot');
  const sse = new EventSource('/watch');
  sse.onopen    = () => dot.classList.remove('error');
  sse.onerror   = () => dot.classList.add('error');
  sse.onmessage = async (e) => {
    if (e.data === 'reload') {
      await loadComments();
      await loadContent();
      toast('ファイルが更新されました');
    }
  };
}

// ── Theme ─────────────────────────────────────────────────────────────────────
const HLJS_DARK  = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/base16/gruvbox-dark-medium.min.css';
const HLJS_LIGHT = 'https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/base16/gruvbox-light-medium.min.css';

function applyHljsTheme(dark) {
  document.getElementById('hljs-theme').href = dark ? HLJS_DARK : HLJS_LIGHT;
}

document.getElementById('btn-theme').addEventListener('click', () => {
  const isLight = document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = isLight ? 'dark' : 'light';
  applyHljsTheme(isLight);
  initMermaid();
  mermaidSeq = 0;
  renderSource(state.source);
  localStorage.setItem('nymph-theme', document.documentElement.dataset.theme);
});

// ── Wire up buttons ───────────────────────────────────────────────────────────
document.getElementById('btn-comments').addEventListener('click', () => {
  const panel = document.getElementById('comments-panel');
  panel.classList.contains('open') ? closePanel() : openPanel();
});
document.getElementById('btn-close-panel').addEventListener('click', closePanel);
document.getElementById('btn-copy').addEventListener('click', copyReview);
document.getElementById('btn-clear-all').addEventListener('click', openClearAllModal);
document.getElementById('btn-confirm-cancel').addEventListener('click', closeClearAllModal);
document.getElementById('confirm-backdrop').addEventListener('click', closeClearAllModal);
document.getElementById('btn-confirm-ok').addEventListener('click', clearAllComments);

document.getElementById('modal-backdrop').addEventListener('click', closeCommentModal);
document.getElementById('btn-cancel').addEventListener('click', closeCommentModal);
document.getElementById('btn-submit').addEventListener('click', submitComment);
document.getElementById('comment-ta').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitComment();
  if (e.key === 'Escape') closeCommentModal();
});

document.getElementById('btn-checkpoint').addEventListener('click', async () => {
  const res = await fetch('/checkpoint', { method: 'POST', headers: {'Content-Length': '0'} });
  const data = await res.json();
  toast(`チェックポイントを設定しました（${data.lines}行）`);
  document.getElementById('btn-checkpoint').classList.add('has-checkpoint');
  if (state.diffMode) {
    await loadDiff();
    applyDiffHighlight();
  }
});

document.getElementById('btn-diff').addEventListener('click', async () => {
  state.diffMode = !state.diffMode;
  document.getElementById('btn-diff').classList.toggle('active', state.diffMode);
  if (state.diffMode) {
    await loadDiff();
  }
  applyDiffHighlight();
});

document.getElementById('btn-close-drawio').addEventListener('click', closeDrawioModal);
document.getElementById('drawio-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('drawio-modal')) closeDrawioModal();
});
document.getElementById('btn-dl-drawio').addEventListener('click', () =>
  downloadDrawio(state.mermaidPending));
document.getElementById('btn-copy-mermaid').addEventListener('click', () => {
  navigator.clipboard.writeText(state.mermaidPending || '')
    .then(() => toast('コードをコピーしました'));
});

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ── Init ──────────────────────────────────────────────────────────────────────
const savedTheme = localStorage.getItem('nymph-theme');
if (savedTheme) {
  document.documentElement.dataset.theme = savedTheme;
  applyHljsTheme(savedTheme !== 'light');
}

(async () => {
  await loadContent();
  await loadComments();
  connectSSE();
})();
</script>
</body>
</html>
